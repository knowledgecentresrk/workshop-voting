<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Workshop Poll • Projector View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --border-card: #cbd5e1;
            --border-lead: #059669;
            --text-dark: #0f172a;
            --text-slate: #334155;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --lead-green: #059669;
            --lead-light: #d1fae5;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #f1f5f9 100%);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            padding: 24px 40px 18px;
            user-select: none;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .workshop-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 16px;
            border-radius: 9999px;
            margin-bottom: 6px;
            box-shadow: 0 2px 5px rgba(79, 70, 229, 0.15);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .main-question {
            font-size: clamp(24px, 2.4vw, 34px);
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        .question-blank {
            color: var(--primary);
            border-bottom: 4px solid var(--primary);
            padding-bottom: 2px;
        }

        /* 2-Column Split Workspace: 7 Bars Left | QR Code Right */
        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 28px;
            flex: 1;
            min-height: 0;
        }

        /* Left: 7 Bars */
        .bars-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            min-height: 0;
        }

        .bar-card {
            background: #ffffff;
            border: 2px solid var(--border-card);
            border-radius: 14px;
            padding: 12px 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--shadow-card);
            transition: all 0.3s ease;
        }

        .bar-card.is-leading {
            border-color: var(--border-lead);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
            background: #f0fdf4;
        }

        /* Smooth Progress Bar Fill */
        .bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, rgba(79, 70, 229, 0.18) 0%, rgba(99, 102, 241, 0.3) 100%);
            border-right: 4px solid var(--primary);
            transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1;
        }

        .bar-card.is-leading .bar-fill {
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.35) 100%);
            border-right: 4px solid var(--lead-green);
        }

        /* Content inside Bar */
        .bar-content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .option-icon {
            font-size: 26px;
            flex-shrink: 0;
        }

        .option-text {
            font-size: clamp(16px, 1.35vw, 20px);
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .bar-card.is-leading .option-text {
            color: #064e3b;
        }

        .option-metrics {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-shrink: 0;
        }

        .percentage-text {
            font-size: clamp(24px, 2.1vw, 32px);
            font-weight: 900;
            color: var(--text-dark);
            min-width: 75px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .bar-card.is-leading .percentage-text {
            color: var(--lead-green);
        }

        .count-text {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 45px;
            text-align: right;
        }

        /* Right Column: QR Code + Stats */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .qr-box {
            background: #ffffff;
            border: 2px solid var(--border-card);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            flex: 1;
        }

        .qr-badge {
            background: var(--primary-light);
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 4px 14px;
            border-radius: 9999px;
            margin-bottom: 8px;
        }

        .qr-heading {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .qr-subtext {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        #qr-canvas-holder {
            background: #ffffff;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #qr-canvas-holder canvas,
        #qr-canvas-holder img {
            width: 215px !important;
            height: 215px !important;
            display: block;
        }

        .qr-website-url {
            margin-top: 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-slate);
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 6px 12px;
            border-radius: 8px;
            word-break: break-all;
        }

        /* Counter Card */
        .counter-card {
            background: #ffffff;
            border: 2px solid var(--border-card);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }

        .counter-label {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .counter-number {
            font-size: 42px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.1;
        }

        /* Bottom Controls */
        .bottom-bar {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #e2e8f0;
            padding-top: 12px;
            flex-shrink: 0;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-slate);
        }

        .btn-fullscreen {
            background: #ffffff;
            border: 2px solid var(--border-card);
            color: var(--text-dark);
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: all 0.2s;
        }

        .btn-fullscreen:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div>
            <div class="workshop-pill">
                <span class="pulse-dot"></span>
                <span>The Little Years, The Big Years • Parenting Workshop</span>
            </div>
            <h1 class="main-question" id="poll-title">One thing my child does that drives me crazy is ________</h1>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="workspace-grid">
        
        <!-- Left: 7 Large Bars -->
        <div class="bars-container" id="bars-list">
            <!-- Dynamically populated -->
        </div>

        <!-- Right: QR Code & Counter -->
        <div class="right-column">
            
            <div class="qr-box">
                <span class="qr-badge">Activity: Break The Ice</span>
                <div class="qr-heading">Scan to Vote</div>
                <div class="qr-subtext">Open your phone camera & scan</div>
                <div id="qr-canvas-holder"></div>
                <div class="qr-website-url" id="qr-display-url">knowledgecentresrk.github.io</div>
            </div>

            <div class="counter-card">
                <div class="counter-label">Total Parent Responses</div>
                <div class="counter-number" id="live-total-val">0</div>
            </div>

        </div>
    </main>

    <!-- Bottom Bar -->
    <footer class="bottom-bar">
        <div class="status-pill">
            <span class="pulse-dot"></span>
            <span id="live-status-desc">Live Audience Sync Active</span>
        </div>

        <button class="btn-fullscreen" onclick="toggleFullScreen()">⛶ Fullscreen Display (F11)</button>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let db = null;
        const totalValEl = document.getElementById("live-total-val");
        const statusDescEl = document.getElementById("live-status-desc");

        // Format Question with Blank
        document.getElementById("poll-title").innerHTML = POLL_DATA.question.replace("________", '<span class="question-blank">________</span>');

        // Build the 7 Option Rows
        function setupBars() {
            const list = document.getElementById("bars-list");
            list.innerHTML = "";

            POLL_DATA.options.forEach(opt => {
                const card = document.createElement("div");
                card.className = "bar-card";
                card.id = `bar-card-${opt.id}`;

                card.innerHTML = `
                    <div class="bar-fill" id="fill-${opt.id}"></div>
                    <div class="bar-content">
                        <div class="option-left">
                            <span class="option-icon">${opt.icon || "✨"}</span>
                            <span class="option-text">${opt.text}</span>
                        </div>
                        <div class="option-metrics">
                            <div class="percentage-text" id="pct-${opt.id}">0%</div>
                            <div class="count-text" id="cnt-${opt.id}">(0)</div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        setupBars();

        // Generate Crisp High-Resolution QR Code (215px)
        function renderQR() {
            const currentUrl = window.location.href;
            const votingUrl = currentUrl.replace(/results\.html(\?.*)?$/i, "index.html");

            document.getElementById("qr-display-url").innerText = votingUrl.replace(/^https?:\/\//, '');

            new QRCode(document.getElementById("qr-canvas-holder"), {
                text: votingUrl,
                width: 215,
                height: 215,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        renderQR();

        // Connect to Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            startLiveSync();
        } catch (e) {
            console.error("Firebase connection error:", e);
            statusDescEl.innerText = "Error connecting to Firebase";
        }

        // Live Real-Time Listener
        function startLiveSync() {
            const votesRef = db.ref("votes");

            votesRef.on("value", snapshot => {
                const votes = snapshot.val() || {};
                const uids = Object.keys(votes);
                const total = uids.length;

                totalValEl.innerText = total;

                // Tally responses
                const counts = {};
                POLL_DATA.options.forEach(o => counts[o.id] = 0);

                uids.forEach(uid => {
                    const optId = votes[uid].optionId;
                    if (counts[optId] !== undefined) {
                        counts[optId]++;
                    }
                });

                // Determine leader
                let max = 0;
                Object.values(counts).forEach(c => {
                    if (c > max) max = c;
                });

                // Update Bars
                POLL_DATA.options.forEach(opt => {
                    const count = counts[opt.id] || 0;
                    const pct = total > 0 ? Math.round((count / total) * 100) : 0;

                    const fillEl = document.getElementById(`fill-${opt.id}`);
                    const cardEl = document.getElementById(`bar-card-${opt.id}`);
                    const pctEl = document.getElementById(`pct-${opt.id}`);
                    const cntEl = document.getElementById(`cnt-${opt.id}`);

                    if (fillEl) fillEl.style.width = pct + "%";
                    if (pctEl) pctEl.innerText = pct + "%";
                    if (cntEl) cntEl.innerText = `(${count})`;

                    if (cardEl) {
                        if (max > 0 && count === max) {
                            cardEl.classList.add("is-leading");
                        } else {
                            cardEl.classList.remove("is-leading");
                        }
                    }
                });

                statusDescEl.innerText = total > 0 
                    ? `Live: ${total} parent${total > 1 ? 's have' : ' has'} submitted` 
                    : "Waiting for parents to scan & submit...";
            });
        }

        // Fullscreen Toggle
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
